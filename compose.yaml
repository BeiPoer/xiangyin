services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_USERNAME: ${APP_USERNAME:?请在 .env 中设置账号}
      APP_PASSWORD: ${APP_PASSWORD:?请在 .env 中设置密码}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${PORT:-3025}:3025"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3025/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  app_data:
